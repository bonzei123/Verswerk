services:
  verswerk:
    image: ghcr.io/bonzei123/verswerk:latest
    build: .
    # Kein container_name — sonst kollidiert Compose mit Watchtower-Recreates
    # (Name schon vergeben). Compose nennt den Container z.B. verswerk-verswerk-1.
    ports:
      - "6997:6997"
    environment:
      - PORT=6997
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    volumes:
      - verswerk-data:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    restart: unless-stopped

volumes:
  verswerk-data:
