services:
  verswerk:
    image: ghcr.io/bonzei123/verswerk:latest
    build: .
    container_name: verswerk
    ports:
      - "6997:6997"
    environment:
      - PORT=6997
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - VERSWERK_DATA_DIR=/data/vaults
    volumes:
      # Verschlüsselte Vaults überleben Container-Updates
      - verswerk-data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: verswerk-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    restart: unless-stopped

volumes:
  verswerk-data:
